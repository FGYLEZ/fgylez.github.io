    <script type="text/javascript">
    (function () {
        'use strict';

        var finished = false;   // 点击“好的”后置为 true，页面被清空
        var dialogOpen = false; // 提示框是否正在显示
        var dialog = null;
        var okBtn = null;

        // 判断是否为我们生成的提示框内部元素
        function isDialogPart(el) {
            return !!dialog && (el === dialog || dialog.contains(el));
        }

        // 判断元素是否可见（隐藏元素不计入可销毁范围）
        function isVisible(el) {
            var node = el;
            while (node && node.nodeType === 1) {
                var cs = window.getComputedStyle(node);
                if (!cs || cs.display === 'none' || cs.visibility === 'hidden') return false;
                node = node.parentElement;
            }
            return true;
        }

        // 统计 body 中剩余的可见原始元素（排除提示框自身）
        function remainingCount() {
            if (!document.body) return 0;
            var all = document.body.querySelectorAll('*');
            var count = 0;
            for (var i = 0; i < all.length; i++) {
                var el = all[i];
                if (isDialogPart(el)) continue;
                if (isVisible(el)) count++;
            }
            return count;
        }

        // 显示“最后一个元素被销毁”提示框
        function showDialog() {
            if (dialogOpen || finished) return;
            dialogOpen = true;

            dialog = document.createElement('div');
            dialog.id = '__destroy_dialog__';
            dialog.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);' +
                'z-index:2147483647;background:#ffffff;color:#222222;border:1px solid #cccccc;' +
                'border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,0.3);padding:30px 40px;' +
                'min-width:260px;text-align:center;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;' +
                'font-size:18px;line-height:1.6;';

            var msg = document.createElement('div');
            msg.textContent = '恭喜你滚木了！';
            msg.style.cssText = 'margin-bottom:22px;font-size:18px;color:#222222;';

            okBtn = document.createElement('button');
            okBtn.type = 'button';
            okBtn.textContent = '好的';
            okBtn.style.cssText = 'cursor:pointer;padding:8px 28px;font-size:16px;color:#ffffff;' +
                'background:#409eff;border:0;border-radius:4px;line-height:1.5;';

            dialog.appendChild(msg);
            dialog.appendChild(okBtn);
            (document.body || document.documentElement).appendChild(dialog);
        }

        // 关闭提示框并清空页面，只剩空白
        function finish() {
            finished = true;
            dialogOpen = false;
            dialog = null;
            okBtn = null;
            document.body.innerHTML = '';
            document.body.style.cssText = 'margin:0;padding:0;background:#ffffff;';
            document.documentElement.style.background = '#ffffff';
        }

        // 统一处理：先阻断原有交互，再销毁被点击的元素
        function onActivate(target) {
            if (finished) return;

            if (dialogOpen) {
                if (target === okBtn) finish();
                return;
            }

            if (!target || target.nodeType !== 1) return;
            if (target === document.documentElement || target === document.body) return;
            if (isDialogPart(target)) return;

            if (target.parentNode) target.parentNode.removeChild(target);
            if (remainingCount() === 0) showDialog();
        }

        // 在捕获阶段最前拦截，禁用所有原有点击交互（链接、onclick、外部脚本等）
        window.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopImmediatePropagation();
            onActivate(e.target);
        }, true);

        // 禁用键盘对链接/按钮的激活，避免绕过点击拦截
        window.addEventListener('keydown', function (e) {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            var t = e.target;
            if (!t || (t.tagName !== 'A' && t.tagName !== 'BUTTON')) return;
            e.preventDefault();
            e.stopImmediatePropagation();
            onActivate(t);
        }, true);

        // 禁用表单提交等默认行为
        window.addEventListener('submit', function (e) {
            e.preventDefault();
            e.stopImmediatePropagation();
        }, true);
    })();
    </script>
